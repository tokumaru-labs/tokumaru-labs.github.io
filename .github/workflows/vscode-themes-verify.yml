name: Verify VS Code themes

on:
  pull_request:
    paths:
      - "vscode-themes/**"
      - ".github/workflows/vscode-themes-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate theme definitions
        working-directory: vscode-themes
        run: npm run validate
      - name: Package VSIX
        working-directory: vscode-themes
        run: npm run package
      - name: Verify archive integrity and checksum
        run: |
          unzip -t vscode-themes/tokumaru-vscode-themes-0.2.0.vsix
          sha256sum vscode-themes/tokumaru-vscode-themes-0.2.0.vsix
      - name: Keep VSIX as review artifact (not published)
        uses: actions/upload-artifact@v4
        with:
          name: tokumaru-vscode-themes-0.2.0-review
          path: vscode-themes/tokumaru-vscode-themes-0.2.0.vsix
          if-no-files-found: error
          retention-days: 14
