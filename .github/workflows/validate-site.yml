name: Validate static site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, metadata and search visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"
      - name: Test the validator against valid and broken fixtures
        run: |
          if python -m unittest discover -s tests -p 'test_validate_site.py' -v; then
            printf 'Validator regression tests: **PASS**. See step log for individual cases.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Validator regression tests: **FAIL**. See step log for individual cases.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test download history and release safeguards
        run: python -B -m unittest discover -s tests -p 'test_download_stats.py' -v
      - name: Test statistics calculations and CSV export
        run: node --test tests/download_stats.test.mjs
      - name: Validate CHA.EXE archive and reproducible machine code
        run: python -B -m unittest discover -s tests -p 'test_cha_exe.py' -v
      - name: Validate the checked-out site
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python scripts/validate_site.py --summary "$GITHUB_STEP_SUMMARY"

  cha-windows-smoke:
    name: CHA.EXE Windows runtime smoke test
    runs-on: windows-2022
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Confirm source reproducibility and package integrity
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p 'test_cha_exe.py' -v
      - name: Check patch whitespace
        shell: pwsh
        run: |
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed.' }
      - name: Test smoke safeguards on Windows PowerShell 5.1 (no EXE launch)
        shell: powershell
        run: ./tests/test_cha_windows_smoke.ps1
      - name: Test smoke safeguards on PowerShell 7 (no EXE launch)
        shell: pwsh
        run: ./tests/test_cha_windows_smoke.ps1
      - name: Explicitly launch and inspect CHA.EXE
        shell: pwsh
        run: ./tests/cha_windows_smoke.ps1 -RunExecutable -AllowUnavailableDefenderOnCI -OutputDirectory "$env:RUNNER_TEMP/cha-smoke-results"
      - name: Record smoke result in job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path "$env:RUNNER_TEMP/cha-smoke-results/cha-smoke-*/result.json" -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            'CHA smoke report was not produced; inspect the failed step.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          foreach ($report in $reports) {
            $json = Get-Content -LiteralPath $report.FullName -Raw
            Write-Output $json
            '```json', $json, '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain smoke reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cha-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cha-smoke-results/cha-smoke-*/result.json
          if-no-files-found: warn
          retention-days: 14
