name: Validate static site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, metadata and search visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"
      - name: Test the validator against valid and broken fixtures
        run: |
          if python -m unittest discover -s tests -p 'test_validate_site.py' -v; then
            printf 'Validator regression tests: **PASS**. See step log for individual cases.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Validator regression tests: **FAIL**. See step log for individual cases.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test download history and release safeguards
        run: python -B -m unittest discover -s tests -p 'test_download_stats.py' -v
      - name: Test statistics calculations and CSV export
        run: node --test tests/download_stats.test.mjs
      - name: Validate the checked-out site
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python scripts/validate_site.py --summary "$GITHUB_STEP_SUMMARY"
