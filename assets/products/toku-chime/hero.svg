<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Toku Chime interface preview</title>
<desc id="desc">A dark interval chime interface with a 30 second countdown, start button, and 30, 45, 60 second presets.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#07101c"/>
    <stop offset="1" stop-color="#101b2a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#5ee7ff"/>
    <stop offset="1" stop-color="#77a7ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1280" height="800" rx="48" fill="url(#bg)"/>
<circle cx="210" cy="80" r="210" fill="#5ee7ff" opacity=".05"/>
<circle cx="1120" cy="170" r="280" fill="#77a7ff" opacity=".05"/>
<g filter="url(#shadow)">
  <rect x="180" y="86" width="920" height="628" rx="34" fill="#0d1724" stroke="#26364d" stroke-width="2"/>
</g>
<text x="226" y="145" fill="#eef5ff" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Tokumaru Labs</text>
<rect x="900" y="117" width="152" height="38" rx="19" fill="none" stroke="#26364d"/>
<text x="976" y="142" text-anchor="middle" fill="#91a1b7" font-family="system-ui, sans-serif" font-size="17">local-first</text>

<text x="226" y="224" fill="#5ee7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="4">INTERVAL CHIME</text>
<text x="226" y="290" fill="#eef5ff" font-family="system-ui, sans-serif" font-size="66" font-weight="800">Toku Chime</text>
<text x="226" y="339" fill="#91a1b7" font-family="system-ui, sans-serif" font-size="23">30秒ごとに、静かに「チーン」。</text>

<rect x="226" y="382" width="828" height="250" rx="26" fill="#101c2a" stroke="#26364d"/>
<text x="640" y="425" text-anchor="middle" fill="#91a1b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4">NEXT CHIME</text>
<text x="640" y="531" text-anchor="middle" fill="#eef5ff" font-family="system-ui, sans-serif" font-size="112" font-weight="800" letter-spacing="-7">00:30</text>

<g font-family="system-ui, sans-serif" font-size="18" font-weight="700">
  <rect x="274" y="558" width="142" height="48" rx="14" fill="#17313c" stroke="#5ee7ff"/>
  <text x="345" y="588" text-anchor="middle" fill="#dffbff">30秒</text>
  <rect x="430" y="558" width="142" height="48" rx="14" fill="#121d2c" stroke="#26364d"/>
  <text x="501" y="588" text-anchor="middle" fill="#eef5ff">45秒</text>
  <rect x="586" y="558" width="142" height="48" rx="14" fill="#121d2c" stroke="#26364d"/>
  <text x="657" y="588" text-anchor="middle" fill="#eef5ff">60秒</text>
  <rect x="760" y="558" width="246" height="48" rx="14" fill="url(#accent)"/>
  <text x="883" y="588" text-anchor="middle" fill="#03111c">START</text>
</g>

<g transform="translate(1050 486)">
  <circle cx="0" cy="0" r="74" fill="#0a1420" stroke="#26364d" stroke-width="2"/>
  <path d="M-17-18c0-16 10-28 27-28s27 12 27 28v17c0 11 4 20 12 27H-39c8-7 12-16 12-27z" fill="none" stroke="#5ee7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-12 31c3 10 10 15 21 15s18-5 21-15" fill="none" stroke="#77a7ff" stroke-width="7" stroke-linecap="round"/>
</g>
</svg>
